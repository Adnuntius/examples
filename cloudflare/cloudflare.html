<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Adnuntius Ad Tag Generator and Tester</title>
</head>
<body>
  <h1>Calling Via Cloudflare</h1>
  
<h3>Adnuntius Ad Tag Generator and Tester</h3>
<div id="timingHook">
</div>
<hr>
<p><small>Ad request: auId = 432e3</small></p>
<div id="hook">
</div>
<script src="https://cdn.adnuntius.com/adn.js" async></script>
<script>
  window.adn = window.adn || {}; adn.calls = adn.calls || [];
  adn.calls.push(function() {
    const divHook = document.getElementById("hook");
    const timingHook = document.getElementById("timingHook");

    let runningTotal = 0;
    for (let i = 0; i < 100; i++) {
      const divTargetId = "target-" + i;
      const divTimingTargetId = "target-timing-" + i;

      const diff = i + Math.max(0, i - 1);
      runningTotal = runningTotal + diff;

      (function(runningTotal, diff) {
        setTimeout(function() {
          const divEl = document.createElement("div");
          divEl.id = divTargetId;
          divHook.appendChild(divEl);

          const timingEl = document.createElement("div");
          timingEl.id = divTimingTargetId;
          timingHook.appendChild(timingEl);

          adn.request({  network: '5c', env: 'cloudflare', timingFunc: function(ads, time) { document.getElementById(divTimingTargetId).innerHTML = "Ad request at " + runningTotal + "s took " + time + "ms"; }, adUnits: [
              { auId: '432e3', targetId: divTargetId, auW: '10000', auH: '10000', kv: { 'isolate': ['creative-tag-gdpr'] } }
            ]});

        }, 1000 * runningTotal);
      })(runningTotal, diff)
    }
  });
</script>
</body>
</html>
