
<html>

<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script async src="https://www.googletagservices.com/tag/js/gpt.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/prebid.js@9.33.0/dist/not-for-prod/prebid.js"></script>
  <script>
    var PREBID_TIMEOUT = 100000;
    var FAILSAFE_TIMEOUT = 200000;

    let sizes = [[980, 360], [980, 300], [980, 240], [980, 120], [300, 250], [720, 960]];
    var adUnits = [
      {
        code: "div-1",
        mediaTypes: {
          banner: {
            sizes: sizes
          },
          native: {
            "sizes": sizes,
            kv:
              [{placement: ["ad-netboard1"]}, {publisher: ["www.dagbladet.no"]}, {page_section: 'sport'}, {os: "MacOS"}, {category: ["Entertainment", "Sports"]}, {keywords: ["one", "two"]}, {page_type: "article"}, {context: ["feil"]}, {tags: ["something"]}]
            ,
            "ortb": {
              "ver": "1.2",
              "assets": [
                {
                  "id": 0,
                  "required": 1,
                  "img": {
                    "type": 3,
                    "wmin": 500,
                    "hmin": 150,
                    "ext": {
                      "aspectratios": [
                        "1.91:1"
                      ]
                    }
                  }
                },
                {
                  "id": 1,
                  "required": 1,
                  "title": {
                    "len": 200
                  }
                },
                {
                  "id": 2,
                  "required": 0,
                  "data": {
                    "type": 2,
                    "len": 90
                  }
                },
                {
                  "id": 3,
                  "required": 1,
                  "data": {
                    "type": 1
                  }
                },
                {
                  "id": 4,
                  "required": 0,
                  "img": {
                    "type": 1,
                    "w": 50,
                    "h": 50
                  }
                }
              ]
            }
          }
        },
        bids: [
          {
            bidder: "adnuntius",
            params: {
              auId: "eddf6",
              network: "b7462",
              bidType: 'netBid'
            }
          }
        ],
        renderer: {
          render: function(bid) {
            console.log("BID", bid);
            if (!bid.native) {
              document.getElementById('div-1').innerHTML = bid.ad;
            }
            // Example: Use a custom template to render the native ad
            var adHtml = `
            <div class="native-ad-container">
              <h3>${bid.native.title}</h3>
              <div><img width="20" src="${bid.native.icon.url}"></div>
              <div><a href="${bid.native.clickUrl}"><img src="${bid.native.image.url}"></a></div>
              <p>${bid.native.body}</p>
              <p>${bid.native.body2}</p>
              <p>Phone: ${bid.native.phone}</p>
              <p>Rating: ${bid.native.rating}</p>
              <p>Likes: ${bid.native.likes}</p>
              <div><a href="${bid.native.clickUrl}">${bid.native.displayUrl}</a></div>
              <p><small>Sponsored by: ${bid.native.sponsoredBy}</small></p>
              <p><small>Downloads: ${bid.native.downloads}</small></p>
              <!--
              <p><small>Call to Action: ${bid.native.ctoa}</small></p>
              <p><small>Price: ${bid.native.price}</small></p>
              <p><small>Sale Price: ${bid.native.salePrice}</small></p>
              -->
            </div>
        `;
            document.getElementById('div-1').innerHTML = adHtml;
          }
        }
      }
    ];

    // ======== DO NOT EDIT BELOW THIS LINE =========== //
    var googletag = googletag || {};
    googletag.cmd = googletag.cmd || [];
    googletag.cmd.push(function() {
      googletag.pubads().disableInitialLoad();
    });

    var pbjs = pbjs || {};
    pbjs.que = pbjs.que || [];

    pbjs.que.push(function() {
      pbjs.setConfig({debug: true});
      pbjs.addAdUnits(adUnits);
      pbjs.requestBids({
        bidsBackHandler: initAdserver,
        timeout: PREBID_TIMEOUT
      });
    });

    function initAdserver() {
      if (pbjs.initAdserverSet) return;
      pbjs.initAdserverSet = true;
      googletag.cmd.push(function() {
        pbjs.que.push(function() {
          pbjs.setTargetingForGPTAsync();
          googletag.pubads().refresh();
        });
      });
    }

    // in case PBJS doesn't load
    setTimeout(function() {
      initAdserver();
    }, FAILSAFE_TIMEOUT);


    googletag.cmd.push(function() {
      googletag.defineSlot('/19968336/header-bid-tag-0', sizes, 'div-1').addService(googletag.pubads());
      googletag.pubads().enableSingleRequest();
      googletag.enableServices();
    });


  </script>

</head>

<body style="background-color: lightblue">
<h2>Native Ad Example - FROM DAGBLADET</h2>
<p>Below there's a native ad -- it's the thing in the box.</p>
<div id='div-1' style="background-color: #d0d0ff; border: 1px solid black; padding: 10px 20px; display: inline-block;max-width: 250px;">
  <script type='text/javascript'>
    googletag.cmd.push(function() {
      document.getElementById("hook").innerHTML = "MY EXAMPLE";
      googletag.display('div-1');
    });
  </script>
</div>
